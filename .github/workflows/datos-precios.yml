name: Datos de precios (SEPA)

# Corre todos los días y publica los precios procesados en GitHub Pages.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
on:
  schedule:
    - cron: "17 14 * * *"   # 11:17 de Argentina (los comercios rectifican hasta las 10)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/datos-precios.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procesar SEPA
        run: |
          set -o pipefail
          python scripts/procesar_sepa.py --salida sitio 2>&1 | tee sepa.log

      - name: Mostrar errores
        if: failure()
        run: |
          f=$(ls *.log 2>/dev/null | head -1); [ -z "$f" ] && exit 0
          grep -E "^e: |error:|Error|What went wrong|Traceback|Exception|^  File|^[A-Za-z]+Error" -A2 "$f" | grep -v "^--$" | head -80 > errores.txt || true
          [ -s errores.txt ] || tail -40 "$f" > errores.txt
          split -l 12 errores.txt parte_
          for p in parte_*; do echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$p")"; done

      - name: Alertas ANMAT
        run: python scripts/alertas_anmat.py --salida sitio || echo "No se pudieron actualizar las alertas"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: procesar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
