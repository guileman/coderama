name: Datos de precios (SEPA)

# Corre todos los días y publica los precios procesados en GitHub Pages.
#
# IMPORTANTE: el servidor del SEPA (datos.produccion.gob.ar) bloquea las conexiones
# desde fuera de Argentina, incluidos los servidores de GitHub. Por eso el
# procesamiento corre en una computadora en Argentina con un "self-hosted runner":
#   1. Settings → Actions → Runners → New self-hosted runner (instalarlo en la PC).
#   2. Settings → Secrets and variables → Actions → Variables → RUNNER_SEPA = self-hosted
# Sin esa variable, intenta correr en los servidores de GitHub.
#
# Requisito de publicación: Settings → Pages → Source: "GitHub Actions".
on:
  schedule:
    - cron: "17 14 * * *"   # 11:17 de Argentina (los comercios rectifican hasta las 10)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/datos-precios.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ${{ vars.RUNNER_SEPA || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Verificar Python (PC propia)
        if: runner.environment != 'github-hosted' && runner.os == 'Windows'
        shell: cmd
        run: |
          echo ::warning::Usuario del runner: %USERNAME% - Carpeta: %CD%
          for %%d in ("C:\Program Files\Python314" "C:\Program Files\Python313" "C:\Program Files\Python312" "C:\Program Files\Python311" "C:\Python312") do (
            if exist "%%~d\python.exe" (
              echo %%~d>>"%GITHUB_PATH%"
              echo ::warning::Python encontrado en %%~d
              "%%~d\python.exe" --version
              exit /b 0
            )
          )
          echo ::error::El runner no encuentra Python en C:\Program Files. Instalalo para todos los usuarios: winget install Python.Python.3.12 --scope machine
          exit /b 1

      - name: Procesar SEPA
        shell: cmd
        run: python scripts\procesar_sepa.py --salida sitio

      - name: Alertas ANMAT
        continue-on-error: true
        shell: cmd
        run: python scripts\alertas_anmat.py --salida sitio

      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: sitio
          include-hidden-files: true
          retention-days: 2

  armar-pages:
    needs: procesar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: armar-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
